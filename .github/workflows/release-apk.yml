name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK (Kotlin + Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleRelease --stacktrace
        env:
          # Optional: sign release builds from base64 secrets (overrides local keystore.properties)
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK Output
        run: cp android-app/app/build/outputs/apk/release/app-release.apk fauji-niwas-latest.apk

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fauji-niwas-latest.apk
          name: Fauji Niwas ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true