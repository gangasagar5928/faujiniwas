name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: fauji-niwas_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: fauji-niwas_app
        run: flutter build apk --release

      - name: Rename APK Output
        run: cp fauji-niwas_app/build/app/outputs/flutter-apk/app-release.apk fauji-niwas-latest.apk

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: fauji-niwas-latest.apk
          name: Fauji Niwas ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
