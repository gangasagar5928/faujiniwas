<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>FaujiNiwas – Defence Housing Portal</title>
<meta name="description" content="India's verified zero-brokerage defence housing portal built exclusively for Indian Armed Forces families." />
<meta name="author" content="Aman Kumar Singh (Founder), Anurag Kumar Singh (Co-Founder)" />
<meta name="keywords" content="defence housing, military relocation, cantonment rentals, military quarters, KV schools, CSD canteen, Indian Armed Forces, Fauji Niwas, Aman Kumar Singh, Anurag Kumar Singh" />
<!-- Geographic Location Meta Tags (GEO) -->
<meta name="geo.region" content="IN" />
<meta name="geo.placename" content="India" />
<meta name="geo.position" content="20.593684;78.96288" />
<meta name="ICBM" content="20.593684, 78.96288" />
<link rel="preconnect" href="https://mt1.google.com" crossorigin />
<link rel="preconnect" href="https://firebaseapp.com" crossorigin />
<link rel="dns-prefetch" href="https://translate.google.com" />
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Leaflet Google Maps plugin -->
<script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.0/dist/Leaflet.GoogleMutant.js"></script>
<!-- Google Maps API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-9tSrke72PouQMnMX-a7eZSW0jkFMBWY&libraries=places"></script>

<script>
  (function() {
    // Early theme & font size hydration to prevent FOUC
    var savedTheme = localStorage.getItem('fn_theme') || 'light';
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark', 'dark-theme');
      document.body && document.body.classList.add('dark', 'dark-theme');
    } else {
      document.documentElement.classList.remove('dark', 'dark-theme');
      document.documentElement.classList.add('light-theme');
    }
    var savedSize = localStorage.getItem('fn_fontsize') || '16px';
    document.documentElement.style.fontSize = savedSize;
    if (localStorage.getItem('fn_senior') === 'true' || savedSize === '20px') {
      document.documentElement.classList.add('is-elderly-mode');
    }
  })();
</script>

<style>
/* Google Translate widget customization */
.goog-te-gadget-simple {
  background-color: rgba(255, 255, 255, 0.08) !important;
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
  padding: 6px 10px !important;
  border-radius: 8px !important;
  font-family: inherit !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  width: 100% !important;
  box-sizing: border-box !important;
}
.goog-te-gadget-simple .goog-te-menu-value {
  color: #f1f1ee !important;
  font-size: 13px !important;
  font-weight: 500 !important;
  font-family: inherit !important;
  display: flex !important;
  align-items: center !important;
  width: 100% !important;
  justify-content: space-between !important;
}
.goog-te-gadget-simple .goog-te-menu-value span {
  color: #f1f1ee !important;
}
.goog-te-gadget-icon,
.goog-te-gadget-simple .goog-te-menu-value img,
.goog-te-gadget-simple .goog-te-menu-value span:nth-child(3),
.goog-te-gadget-simple .goog-te-menu-value span:nth-child(5),
.goog-te-banner-frame {
  display: none !important;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background-color: #FAF9F6;
  color: #0f172a;
  -webkit-tap-highlight-color: transparent;
}

html.dark-theme, body.dark-theme, html.dark, body.dark {
  background-color: #0b1325 !important;
  color: #f8fafc !important;
}

#root {
  width: 100%;
  height: 100%;
  min-height: 100dvh;
}
</style>
</head>
<body class="app-shell">

<!-- React Mount Target -->
<div id="root"></div>

<!-- App entry point -->
<script type="module" src="/src/main.jsx"></script>
<script src="/chatbot.js" defer></script>

<!-- ♿ ACCESSIBILITY WIDGET -->
<div id="accessibility-widget" class="fixed bottom-24 left-5 md:left-auto md:right-6 md:bottom-28 z-[200000] flex flex-col items-start md:items-end gap-2">
  <!-- Toggle trigger button -->
  <button id="acc-trigger" class="w-14 h-14 rounded-full bg-[#15803d] hover:bg-[#166534] text-white flex items-center justify-center shadow-2xl font-bold text-2xl border-2 border-white select-none transition-all hover:scale-105 active:scale-95 cursor-pointer shadow-emerald-900/40" title="Accessibility Panel / सुगम्यता सेटिंग्स" aria-label="Open Accessibility Panel">
    ♿
  </button>
  
  <!-- Google Translate element lives OUTSIDE the hidden panel so it renders correctly -->
  <div id="google_translate_element" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>

  <!-- Panel popup menu - sleek translucent -->
  <div id="acc-menu" class="hidden flex-col bg-white/95 dark:bg-[#0f172a]/95 backdrop-blur-2xl border border-slate-200/80 dark:border-[#334155] rounded-2xl p-6 shadow-2xl w-[320px] sm:w-[360px] text-left gap-5 text-slate-800 dark:text-white">
    <div class="text-base font-extrabold text-slate-900 dark:text-amber-500 border-b border-slate-200/80 dark:border-[#334155] pb-3 uppercase tracking-wider flex items-center justify-between font-mono">
      <span>Accessibility 🎖️</span>
      <button id="acc-close" class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white text-2xl cursor-pointer font-bold leading-none">&times;</button>
    </div>
    
    <!-- Text Size -->
    <div class="flex flex-col gap-2">
      <span class="text-[12px] font-extrabold uppercase text-slate-600 dark:text-slate-400 font-mono tracking-wider">Text Size / आकार</span>
      <div class="flex gap-2">
        <button id="fs-small" class="flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">A-</button>
        <button id="fs-normal" class="flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">A</button>
        <button id="fs-large" class="flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">A+</button>
        <button id="fs-elderly" class="flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">Senior</button>
      </div>
    </div>
    
    <!-- Language Option -->
    <div class="flex flex-col gap-2">
      <span class="text-[12px] font-extrabold uppercase text-slate-600 dark:text-slate-400 font-mono tracking-wider">Language / भाषा</span>
      <div class="flex flex-wrap gap-1.5 mt-1">
        <button onclick="setLang('en')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="English">EN</button>
        <button onclick="setLang('hi')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Hindi">हिंदी</button>
        <button onclick="setLang('pa')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Punjabi">ਪੰਜਾਬੀ</button>
        <button onclick="setLang('ta')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Tamil">தமிழ்</button>
        <button onclick="setLang('te')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Telugu">తెలుగు</button>
        <button onclick="setLang('mr')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Marathi">मराठी</button>
        <button onclick="setLang('kn')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Kannada">ಕನ್ನಡ</button>
        <button onclick="setLang('bn')" class="px-3 py-1.5 text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg hover:bg-amber-100 dark:hover:bg-amber-900 transition-all cursor-pointer border border-transparent hover:border-amber-400" title="Bengali">বাংলা</button>
      </div>
    </div>
    
    <!-- Dark/Light Theme -->
    <div class="flex flex-col gap-2">
      <span class="text-[12px] font-extrabold uppercase text-slate-600 dark:text-slate-400 font-mono tracking-wider">Contrast Theme / थीम</span>
      <div class="flex gap-2">
        <button id="theme-dark" class="flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">Dark</button>
        <button id="theme-light" class="flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer">Light</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  window.addEventListener('DOMContentLoaded', function() {
    var trigger = document.getElementById('acc-trigger');
    var menu = document.getElementById('acc-menu');
    var closeBtn = document.getElementById('acc-close');

    if (trigger && menu) {
      trigger.addEventListener('click', function() {
        menu.classList.toggle('hidden');
        menu.classList.toggle('flex');
      });
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          menu.classList.add('hidden');
          menu.classList.remove('flex');
        });
      }
    }

    // Google translate init
    window.googleTranslateElementInit = function() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,pa,te,ta,kn,mr,bn',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    };
    if (!document.getElementById('google-translate-script')) {
      var gtScript = document.createElement('script');
      gtScript.id = 'google-translate-script';
      gtScript.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.body.appendChild(gtScript);
    }

    window.setLang = function(langCode) {
      var combo = document.querySelector('.goog-te-combo');
      if (combo) {
        combo.value = langCode;
        combo.dispatchEvent(new Event('change'));
        return;
      }
      if (langCode === 'en') {
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=' + location.hostname + '; path=/;';
        window.location.reload();
      } else {
        document.cookie = 'googtrans=/en/' + langCode + '; path=/;';
        document.cookie = 'googtrans=/en/' + langCode + '; domain=' + location.hostname + '; path=/;';
        window.location.reload();
      }
    };

    var themeDark = document.getElementById('theme-dark');
    var themeLight = document.getElementById('theme-light');
    var savedTheme = localStorage.getItem('fn_theme') || 'light';

    function updateThemeButtons(t) {
      if (!themeDark || !themeLight) return;
      if (t === 'dark') {
        themeDark.className = 'flex-1 py-2.5 text-sm font-black bg-amber-500 text-black rounded-xl transition-all cursor-pointer shadow-md';
        themeLight.className = 'flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer';
      } else {
        themeLight.className = 'flex-1 py-2.5 text-sm font-black bg-amber-500 text-black rounded-xl transition-all cursor-pointer shadow-md';
        themeDark.className = 'flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer';
      }
    }

    function applyDarkTheme(enable) {
      if (enable) {
        document.documentElement.classList.add('dark', 'dark-theme');
        document.body.classList.add('dark', 'dark-theme');
        document.documentElement.classList.remove('light-theme');
        document.body.classList.remove('light-theme');
      } else {
        document.documentElement.classList.remove('dark', 'dark-theme');
        document.body.classList.remove('dark-theme');
        document.documentElement.classList.add('light-theme');
        document.body.classList.add('light-theme');
      }
    }

    if (themeDark) {
      themeDark.addEventListener('click', function() {
        applyDarkTheme(true);
        localStorage.setItem('fn_theme', 'dark');
        updateThemeButtons('dark');
      });
    }
    if (themeLight) {
      themeLight.addEventListener('click', function() {
        applyDarkTheme(false);
        localStorage.setItem('fn_theme', 'light');
        updateThemeButtons('light');
      });
    }
    updateThemeButtons(savedTheme);

    var sizes = {
      '14px': document.getElementById('fs-small'),
      '16px': document.getElementById('fs-normal'),
      '18px': document.getElementById('fs-large'),
      '20px': document.getElementById('fs-elderly')
    };

    var savedSize = localStorage.getItem('fn_fontsize') || '16px';

    function updateSizeButtons(currentSize) {
      Object.keys(sizes).forEach(function(size) {
        var btn = sizes[size];
        if (!btn) return;
        if (size === currentSize) {
          btn.className = 'flex-1 py-2.5 text-sm font-black bg-amber-500 text-black rounded-xl transition-all cursor-pointer shadow-md';
        } else {
          btn.className = 'flex-1 py-2.5 text-sm font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer';
        }
      });
    }

    Object.keys(sizes).forEach(function(size) {
      var btn = sizes[size];
      if (!btn) return;
      btn.addEventListener('click', function() {
        document.documentElement.style.fontSize = size;
        localStorage.setItem('fn_fontsize', size);
        updateSizeButtons(size);
      });
    });
    updateSizeButtons(savedSize);
  });
})();
</script>

<!-- Global Recaptcha Containers for Phone Auth -->
<div id="recaptcha-container" style="display: none;"></div>
<div id="recaptcha-profile" style="display: none;"></div>
</body>
</html>
