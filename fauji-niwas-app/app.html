<script>
  (function() {
    // Early theme & font size hydration to prevent FOUC
    var savedTheme = localStorage.getItem('fn_theme') || 'light';
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark', 'dark-theme');
      document.body && document.body.classList.add('dark', 'dark-theme');
    } else {
      document.documentElement.classList.remove('dark', 'dark-theme');
      document.documentElement.classList.add('light-theme');
    }
    var savedSize = localStorage.getItem('fn_fontsize') || '16px';
    document.documentElement.style.fontSize = savedSize;
    if (localStorage.getItem('fn_senior') === 'true' || savedSize === '20px') {
      document.documentElement.classList.add('is-elderly-mode');
    }
  })();
</script>
